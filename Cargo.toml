[package]
name = "kannolo"
version = "0.14.0"
edition = "2024"
license = "MIT"
description = "kANNolo is designed for easy prototyping of ANN Search algorithms while ensuring high effectiveness and efficiency over both dense and sparse vectors."
repository = "https://github.com/TusKANNy/kannolo"
readme = "README.md"


[dependencies]
serde       = { version = "1.0.219", features = ["derive"] }
rand        = "0.8.5"
itertools   = "0.14.0"
matrixmultiply = "0.3.8"
num-traits  = "0.2.18"
byteorder   = "1.5.0"
half        = { version = "2.4.1", features = ["serde", "std", "num-traits"] }
rayon       = "1.10.0"
bincode     = "2.0.1"
rustc-hash  = "2.1.0"
tantivy-bitpacker = "0.8.0"
vectorium   = { git = "https://github.com/TusKANNy/vectorium.git", branch = "compression" }
indicatif   = { version = "0.18.3", features = ["rayon"] }
postcard    = { version = "1", features = ["alloc"] }
rgb         = { package = "rgbisect", version = "0.1.0" }
toolkit     = { git = "https://github.com/rossanoventurini/toolkit.git", rev = "b26cb3aadfb6dffd4825f2f60e23ec722e24cdbb", features = ["streamvbyte"] }
clap        = { version = "4.3.19", features = ["derive"], optional = true }
pyo3        = { version = "0.29.0", features = ["extension-module"], optional = true }
numpy       = { version = "0.29.0", optional = true }
ndarray     = { version = "0.16", optional = true }
ndarray-npy = { version = "0.9", optional = true }


[features]
default      = []
use-libxsmm  = []
multivec     = ["vectorium/multivec"]
python       = ["dep:pyo3", "dep:numpy", "dep:ndarray", "dep:ndarray-npy"]
cli          = ["dep:clap", "dep:ndarray", "dep:ndarray-npy"]

[[bin]]
name = "hnsw_build"
path = "src/bin/hnsw_build.rs"
required-features = ["cli"]

[[bin]]
name = "hnsw_search"
path = "src/bin/hnsw_search.rs"
required-features = ["cli"]

[[bin]]
name = "hnsw_rerank_search"
path = "src/bin/hnsw_rerank_search.rs"
required-features = ["cli", "multivec"]

[[bin]]
name = "hnsw_rerank_build_dense"
path = "src/bin/hnsw_rerank_build_dense.rs"
required-features = ["cli"]

[[bin]]
name = "hnsw_rerank_search_dense"
path = "src/bin/hnsw_rerank_search_dense.rs"
required-features = ["cli"]

[[bin]]
name = "hnsw_rerank_build_sparse"
path = "src/bin/hnsw_rerank_build_sparse.rs"
required-features = ["cli"]

[[bin]]
name = "hnsw_rerank_search_sparse"
path = "src/bin/hnsw_rerank_search_sparse.rs"
required-features = ["cli"]

[[bin]]
name = "ivf_build"
path = "src/bin/ivf_build.rs"
required-features = ["cli"]

[[bin]]
name = "ivf_search"
path = "src/bin/ivf_search.rs"
required-features = ["cli"]

[lib]
name = "kannolo"
crate-type = ["cdylib", "lib"]

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 1
panic = "abort"
strip = "symbols"
