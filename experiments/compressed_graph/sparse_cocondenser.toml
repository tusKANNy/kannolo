name =          "sparse_cocondenser_cikm2026"
title =         "Search sparse HNSW on MSMARCO Cocondenser with graph compression"
description =   "CIKM 2026 sparse HNSW experiment on MSMARCO Cocondenser: uncompressed vs EGB + StreamVByte"
dataset =       "Splade cocondenser on MS-MARCO"
# compile-command = "cargo build" # Compile in debug mode? default is release mode
build-command = "./target/release/hnsw_build"  # Unified build binary
query-command = "./target/release/hnsw_search" # Unified search binary
dataset-type = "sparse"   # Dataset type: "dense" or "sparse"
component-type = "u16"    # dotpacking8-fixedu8 supports only u16
value-type = "dotpacking8-fixedu8" # Replaces the removed "dotvbyte" encoder
encoder       = "plain"   # Sparse indexes select their representation with value-type
graph-type = "standard"   # Default graph type; each [query.*] subsection may override it

[settings]
k =             10
num-runs       =        1       # Number of runs. PLEASE think carefully how increasing
                        # this may influence your query time
NUMA =          "numactl --physcpubind='0' --localalloc"    # Is the machine NUMA and need to prepend "numactl ..." to query command? Otherwise comment this!
build =         false   # Need to build the index or the index is already built?
metric =        "" # ir_measures metric (e.g. RR)

[folder]
data =          "~/knn_datasets/sparse_datasets/msmarco_v1_passage/cocondenser/data/" # data base path
index =         "~/knn_indexes/sparse_datasets/msmarco_v1_passage/cocondenser/" # index output path
qrels_path =    ""
experiment =    "."     # stdout and stderr of running the experiment is saved here, in a specific subfolder for the current execution

[filename]
dataset =       "documents.bin" # dataset input file name
queries =       "queries.bin" # queries input file name
groundtruth =   "groundtruth.tsv" # ground truth input file
doc_ids =       "doc_ids.npy"
query_ids =     "queries_ids.npy"
index =         "index_cocondenser" # index file name

[indexing_parameters]
m =             32
ef-construction = 2000
metric =        "dotproduct" # DotPacking8 supports only dotproduct

# Graph compression is decided at BUILD time via --graph-type and must match at search time,
# so each graph type needs its own index. The runner builds one index per distinct graph-type
# found below and points each subsection at the matching one.
#
#   standard    -> uncompressed, original node order (the old "compression = none")
#   permuted    -> EGB-reordered nodes, uncompressed neighbour lists
#   streamvbyte -> EGB-reordered nodes + StreamVByte-compressed neighbour lists
#                  (the old "compression = stream-v-byte" with "permute = true")
#
# The three arms are run at every operating point so that the two effects bundled into
# `streamvbyte` can be separated:
#   standard -> permuted     isolates the locality gain from EGB reordering
#   permuted -> streamvbyte  isolates the cost of decoding compressed adjacency lists
#
# Note: the DotPacking8 encoding happens before the EGB permutation, which then copies the
# encoded rows verbatim, so `standard`, `permuted` and `streamvbyte` share the same encoded
# dataset (up to row order) and their differences come from the graph alone.
[query]
    [query.recall_90_standard]
    early-termination = "distance-adaptive"
    ef-search = 10
    lambda = 0.03
    graph-type = "standard"

    [query.recall_90_permuted]
    early-termination = "distance-adaptive"
    ef-search = 10
    lambda = 0.03
    graph-type = "permuted"

    [query.recall_90_streamvbyte]
    early-termination = "distance-adaptive"
    ef-search = 10
    lambda = 0.03
    graph-type = "streamvbyte"

    [query.recall_94_standard]
    early-termination = "distance-adaptive"
    ef-search = 12
    lambda = 0.05
    graph-type = "standard"

    [query.recall_94_permuted]
    early-termination = "distance-adaptive"
    ef-search = 12
    lambda = 0.05
    graph-type = "permuted"

    [query.recall_94_streamvbyte]
    early-termination = "distance-adaptive"
    ef-search = 12
    lambda = 0.05
    graph-type = "streamvbyte"

    [query.recall_98_standard]
    early-termination = "distance-adaptive"
    ef-search = 16
    lambda = 0.12
    graph-type = "standard"

    [query.recall_98_permuted]
    early-termination = "distance-adaptive"
    ef-search = 16
    lambda = 0.12
    graph-type = "permuted"

    [query.recall_98_streamvbyte]
    early-termination = "distance-adaptive"
    ef-search = 16
    lambda = 0.12
    graph-type = "streamvbyte"
